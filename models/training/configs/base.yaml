# Price Transformer v1: the architecture that is trained, compiled and served.
# Keys mirror models.price_transformer.model.ModelConfig and
# models.training.train.TrainingConfig.
model:
  embedding_dim: 128    # Must match data/embedding_model.py EMBEDDING_DIM.
  attribute_dim: 5      # living area, lot area, bedrooms, bathrooms, age.
  d_model: 128
  num_heads: 4          # head_dim 32: one MMA K-step per tile in the kernel.
  num_layers: 2         # Each layer is one RBF-attention rewrite site.
  ffn_dim: 256
  num_candidates: 64    # K comparables per request (the serving shape).
  min_candidates: 4     # Kept when no comparable lies inside the radius.

training:
  batch_size: 256
  epochs: 10
  learning_rate: 3.0e-4
  weight_decay: 0.01
  seed: 0
