<svg xmlns="http://www.w3.org/2000/svg" width="700" height="530" viewBox="0 0 700 530" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Vectra shard routing</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="120" y="70" width="150" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="128" y="88" font-size="11" fill="#334155">shard 1</text>
  <rect x="270" y="70" width="150" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="278" y="88" font-size="11" fill="#334155">shard 1</text>
  <rect x="420" y="70" width="150" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="428" y="88" font-size="11" fill="#334155">shard 3</text>
  <rect x="120" y="180" width="150" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="128" y="198" font-size="11" fill="#334155">shard 1</text>
  <rect x="270" y="180" width="150" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="278" y="198" font-size="11" fill="#334155">shard 1</text>
  <rect x="420" y="180" width="150" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="428" y="198" font-size="11" fill="#334155">shard 3</text>
  <rect x="120" y="290" width="150" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="128" y="308" font-size="11" fill="#334155">shard 1</text>
  <rect x="270" y="290" width="150" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="278" y="308" font-size="11" fill="#334155">shard 1</text>
  <rect x="420" y="290" width="150" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="428" y="308" font-size="11" fill="#334155">shard 3</text>
  <circle cx="382.5" cy="229.5" r="95" fill="#f59e0b" fill-opacity="0.18" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="382.5" cy="229.5" r="4" fill="#b45309"/>
  <text x="390.5" y="221.5" font-size="12" fill="#92400e">query</text>
  <text x="120" y="40" font-size="15" font-weight="bold" fill="#0f172a">Precision-4 cells around the home cell (3×3 bound)</text>
  <text x="120" y="435" font-size="12" fill="#334155">The search disk (radius r) intersects cells owned by shards 1 and 3,</text>
  <text x="120" y="453" font-size="12" fill="#334155">so the query is sent to both and their top-k lists are merged.</text>
  <text x="120" y="471" font-size="12" fill="#334155">A disk reaching beyond this 3×3 block is rejected (INVALID_ARGUMENT).</text>
  <text x="120" y="489" font-size="12" fill="#334155">Inside each shard, precision-5 cells covering the disk select rows,</text>
  <text x="120" y="507" font-size="12" fill="#334155">and the exact great-circle distance admits them.</text>
</svg>
