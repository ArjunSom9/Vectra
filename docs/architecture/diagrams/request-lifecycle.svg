<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Vectra request lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="330" y="20" width="240" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="450.0" y="42" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Client</text>
  <text x="450.0" y="60" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">PricingService.PredictPrice</text>
  <line x1="450" y1="70" x2="450" y2="105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="105" width="360" height="100" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="450.0" y="127" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Inference gateway (serving/)</text>
  <text x="450.0" y="145" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">validate · embed subject</text>
  <text x="450.0" y="163" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">cover disk with 4-char cells → owners</text>
  <text x="450.0" y="181" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">channel pool per shard, round-robin</text>
  <line x1="330" y1="205" x2="170" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100.0" y="232.5" font-size="11" fill="#334155">SearchRequest (sold_before)</text>
  <line x1="570" y1="205" x2="730" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="260" width="260" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="170.0" y="282" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Shard 1 (engine/)</text>
  <text x="170.0" y="300" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">CompletionQueue per core</text>
  <text x="170.0" y="318" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">CallData tag → handler</text>
  <text x="170.0" y="336" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">5-char prefilter</text>
  <text x="170.0" y="354" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">scan or HNSW+PQ → re-rank</text>
  <rect x="600" y="260" width="260" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="730.0" y="282" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Shard 3 (engine/)</text>
  <text x="730.0" y="300" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">same, for the other side</text>
  <text x="730.0" y="318" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">of the shard boundary</text>
  <text x="730.0" y="336" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">(queries near a boundary</text>
  <text x="730.0" y="354" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">reach 2–3 shards)</text>
  <line x1="300" y1="340" x2="360" y2="440" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290.0" y="390.0" font-size="11" fill="#334155">top-k</text>
  <line x1="600" y1="340" x2="540" y2="440" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580.0" y="390.0" font-size="11" fill="#334155">top-k</text>
  <rect x="270" y="440" width="360" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="450.0" y="462" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Merge by squared L2 (all-or-nothing)</text>
  <text x="450.0" y="480" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">batch requests: 2 ms window, up to 64</text>
  <line x1="450" y1="520" x2="450" y2="555" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="555" width="360" height="100" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="450.0" y="577" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Compiled price model (models/)</text>
  <text x="450.0" y="595" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">torch.compile(backend="vectra")</text>
  <text x="450.0" y="613" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">RBF attention → vectra::rbf_attention</text>
  <text x="450.0" y="631" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">fused Triton kernel on H100</text>
  <line x1="450" y1="655" x2="450" y2="690" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="690" width="300" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="450.0" y="712" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Price + comparables</text>
  <text x="450.0" y="730" text-anchor="middle" font-weight="normal" font-size="12" fill="#0f172a">per-stage latency (µs)</text>
</svg>
