// Types shared by every Vectra service contract.

syntax = "proto3";

package vectra.common.v1;

option cc_enable_arenas = true;

// A WGS-84 coordinate in decimal degrees.
message LatLng {
  double latitude = 1;
  double longitude = 2;
}

// Hedonic attributes of a property, consumed by the pricing model.
message PropertyAttributes {
  float living_area_sqft = 1;
  float lot_area_sqft = 2;
  int32 bedrooms = 3;
  float bathrooms = 4;
  int32 year_built = 5;
  // Most recent recorded sale price; 0 when the property never sold.
  double last_sale_price_usd = 6;
  // Days since 1970-01-01 (UTC) of the most recent recorded sale.
  int32 last_sale_epoch_day = 7;
}

// A property as stored by a shard.
message PropertyRecord {
  int64 property_id = 1;
  LatLng location = 2;
  PropertyAttributes attributes = 3;
  // Embedding in the corpus space (128 dimensions in production).
  repeated float embedding = 4;
}

// One retrieved neighbor.
message Candidate {
  int64 property_id = 1;
  // Exact squared L2 distance between the query and candidate embeddings,
  // computed against the full-precision vector during re-ranking.
  float squared_l2 = 2;
  // Great-circle distance from the query location, in kilometers.
  float geo_distance_km = 3;
  LatLng location = 4;
  PropertyAttributes attributes = 5;
  // Present only when the request sets include_embeddings.
  repeated float embedding = 6;
  // Squared L2 norm of the embedding, precomputed at index build time.
  float squared_norm = 7;
  // The candidate's 6-character GeoHash cell as a 30-bit integer.
  uint32 geohash6 = 8;
  // The shard that served this candidate.
  uint32 shard_id = 9;
}
