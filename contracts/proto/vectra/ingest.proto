// Batch insertion of property embeddings into a shard.

syntax = "proto3";

package vectra.ingest.v1;

import "vectra/common.proto";

option cc_enable_arenas = true;

service IngestService {
  // Appends records to the shard's index. Every record must fall inside a
  // GeoHash cell owned by the shard (FAILED_PRECONDITION otherwise), and the
  // shard must have reserved capacity (RESOURCE_EXHAUSTED otherwise).
  rpc Ingest(IngestRequest) returns (IngestResponse);
}

message IngestRequest {
  repeated vectra.common.v1.PropertyRecord records = 1;
}

message IngestResponse {
  uint32 accepted = 1;
  // Number of vectors in the shard after the batch was applied.
  uint64 index_size = 2;
}
