# cpplint 2.0.2 (pinned in pyproject.toml) for the Google C++ Style Guide.
set noparent
linelength=80
# Public headers live under engine/include, so their guards are
# VECTRA_<PATH>_H_ relative to it.
root=engine/include
# clang-format is the authority on whitespace. cpplint reads clang-format's
# continuation lines at namespace scope (constructor initializer lists,
# wrapped initializers) as indented declarations; declarations themselves
# start at column 0, as the style guide requires.
filter=-whitespace/indent_namespace
