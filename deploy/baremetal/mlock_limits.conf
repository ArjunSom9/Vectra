# /etc/security/limits.d/90-vectra.conf, installed by provision.yml.
#
# The shard locks its whole index in RAM (mlockall, ServerOptions.lock_memory)
# so that no query ever waits on a page fault. That needs an unlimited
# RLIMIT_MEMLOCK for the service account. The systemd unit sets the same
# limit (LimitMEMLOCK=infinity), since systemd services do not read this file.
vectra  soft  memlock  unlimited
vectra  hard  memlock  unlimited
# One descriptor per client connection; the gateway pool alone opens
# channel_pool_size connections per gateway process.
vectra  soft  nofile   1048576
vectra  hard  nofile   1048576
